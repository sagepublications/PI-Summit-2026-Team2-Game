<svg xmlns="http://www.w3.org/2000/svg" width="480" height="480" viewBox="0 0 200 200">
  <!-- Enormous scroll unrolling from an email marked "Quick one!" -->
  <rect x="30" y="30" width="80" height="50" rx="4" fill="#f3ead8" stroke="#c9963c" stroke-width="3"/>
  <path d="M30 30 l40 28 l40 -28" stroke="#8a6a45" stroke-width="2.5" fill="none"/>
  <text x="70" y="98" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#c9963c" text-anchor="middle">Quick one!</text>
  <path d="M110 55 q40 0 40 40 v70" stroke="#d8c3a0" stroke-width="26" fill="none"/>
  <path d="M110 55 q40 0 40 40 v70" stroke="#8a6a45" stroke-width="2" fill="none" stroke-dasharray="4 5" transform="translate(-8 0)"/>
  <g stroke="#5a3a22" stroke-width="2">
    <path d="M140 100 h20 M140 110 h16 M140 120 h20 M140 130 h14 M140 140 h20 M140 150 h18"/>
  </g>
  <ellipse cx="150" cy="168" rx="16" ry="8" fill="#bfae94" stroke="#8a6a45" stroke-width="2"/>
  <text x="150" y="190" font-family="Georgia, serif" font-size="10" fill="#f3ead8" text-anchor="middle">38 pages</text>
</svg>
